spring:
  application:
    name: egov-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egov_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    # Set JWT_SECRET env var before running. Must be at least 32 chars (HS256).
    # No hardcoded default — application will fail to start if this is unset.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    com.egov.platform: DEBUG
    org.hibernate.SQL: INFO
